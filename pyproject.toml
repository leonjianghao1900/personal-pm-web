[project]
name = "personal-pm-web"
version = "0.1.0"
description = "Multi-user personal PM on Cloudflare Python Workers, D1, and R2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

# Pip-installable extra for the local ASGI server and smoke tests.
# Pywrangler reads [dependency-groups].dev when bundling the Worker.
[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.32",
    "pytest>=8.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn[standard]>=0.32",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
